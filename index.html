<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WeatherBoard</title>
    <meta name="description" content="Current conditions and a 5-day forecast for the cities you care about." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <!-- Apply the saved theme before first paint (no flash). Mirrors src/features/preferences/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('weatherboard:theme:v1') || '"system"');
          var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>WeatherBoard needs JavaScript to load the forecast.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
